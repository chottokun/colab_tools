name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in editable mode
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify syntax & byte-compilation
        run: |
          python -m compileall colab_mcp tests examples

      - name: Run colab-cli self-check
        run: |
          colab-cli check

      - name: Execute test suite
        run: |
          python run_tests.py

  security:
    name: Security Scan (Bandit & pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & security analyzers
        run: |
          python -m pip install --upgrade pip
          pip install -e . bandit pip-audit

      - name: Run Bandit (SAST Security Audit)
        run: |
          bandit -r colab_mcp

      - name: Run pip-audit (Vulnerability Scan)
        run: |
          pip-audit
